services:
  - type: web
    name: repfix-flowtrack
    env: node
    plan: free
    buildCommand: npm --prefix client install && npm --prefix client run build && npm --prefix server install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_DRIVE_PARENT_FOLDER_ID
        value: 1Y6WnQmk0a8ojNGN3tzE3rPFCLXTU49gC
      - key: GOOGLE_DRIVE_COMPLETED_FOLDER_ID
        value: 1zm67Q9L_V9SN6qHfK_3_lPJO4w6A9JzG


